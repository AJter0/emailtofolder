<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mEnvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="mFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="mVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#30d5c8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="mJetFlame" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="rgba(10,132,255,0)"/>
    </linearGradient>
    <linearGradient id="mShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d5c8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a5cff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="mGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Energy Field -->
  <circle cx="160" cy="130" r="110" fill="url(#mShieldGrad)" filter="url(#mGlow)"/>
  <circle cx="160" cy="130" r="95" stroke="rgba(48,213,200,0.35)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Jet Thruster Trails (Left side) -->
  <path d="M80 120 L10 115 L80 128 Z" fill="url(#mJetFlame)" opacity="0.8"/>
  <path d="M80 145 L20 150 L80 138 Z" fill="url(#mJetFlame)" opacity="0.8"/>
  <!-- Cyber Thruster Nozzles -->
  <rect x="75" y="115" width="12" height="12" rx="3" fill="#1e293b" stroke="#0a84ff" stroke-width="1.5"/>
  <rect x="75" y="135" width="12" height="12" rx="3" fill="#1e293b" stroke="#0a84ff" stroke-width="1.5"/>

  <!-- Main Envelope Hero Body (Sleek Isometric Tilt) -->
  <g transform="translate(85, 60)">
    <!-- Back Body Drop Shadow -->
    <rect x="0" y="0" width="150" height="105" rx="14" fill="#0f172a" opacity="0.5" transform="translate(6, 8)"/>
    
    <!-- Envelope Body Base -->
    <rect x="0" y="0" width="150" height="105" rx="14" fill="url(#mEnvBg)" stroke="#1e293b" stroke-width="3"/>

    <!-- Diagonal Corner Creases -->
    <path d="M0 105 L50 65 M150 105 L100 65" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Upper Aerodynamic Cyber Flap -->
    <path d="M0 14 C0 6.27 6.27 0 14 0 H136 C143.73 0 150 6.27 150 14 V25 L78 72 C76.2 73.2 73.8 73.2 72 72 L0 25 Z" 
          fill="url(#mFlapGrad)" stroke="#0e172a" stroke-width="2.5"/>

    <!-- Holographic Cyber Visor / Eyes (EmailMan's Hero Face) -->
    <rect x="35" y="35" width="80" height="18" rx="9" fill="#030712" stroke="#0a84ff" stroke-width="2"/>
    <rect x="40" y="38" width="70" height="12" rx="6" fill="url(#mVisor)"/>
    <!-- Visor Scan Eye Glint -->
    <circle cx="65" cy="44" r="3.5" fill="#ffffff"/>
    <circle cx="85" cy="44" r="3.5" fill="#ffffff"/>

    <!-- Chest Armor Emblem: Folder Shield Core -->
    <circle cx="75" cy="82" r="13" fill="#0f172a" stroke="#30d5c8" stroke-width="2"/>
    <path d="M70 78 L73 78 L75 80 H79 L81 78 L84 78 V85 C84 86.5 82.5 87 81 87 H73 C71.5 87 70 86.5 70 85 Z" fill="#8a5cff"/>
    <path d="M75 79 L75 83 M73.5 81.5 L75 83 L76.5 81.5" stroke="#30d5c8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cyber Wings (Top & Bottom Flying Fin) -->
  <!-- Top Fin -->
  <path d="M150 58 L180 18 L210 58 Z" fill="linear-gradient(180deg, #30d5c8, #0a84ff)" stroke="#0e172a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M165 52 L180 32 L195 52" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Floating Documents / Invoices Escort -->
  <!-- Document 1 (Invoice PDF) -->
  <g transform="translate(245, 45) rotate(12)">
    <rect x="0" y="0" width="36" height="46" rx="5" fill="#ef4444" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="4" y="4" width="28" height="38" rx="3" fill="#ffffff"/>
    <rect x="8" y="10" width="14" height="3" rx="1.5" fill="#ef4444"/>
    <rect x="8" y="16" width="20" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="8" y="21" width="16" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="8" y="26" width="18" height="2" rx="1" fill="#cbd5e1"/>
    <text x="8" y="37" font-family="monospace" font-size="7" font-weight="bold" fill="#ef4444">PDF</text>
  </g>

  <!-- Document 2 (Excel Sheet) -->
  <g transform="translate(240, 140) rotate(-8)">
    <rect x="0" y="0" width="38" height="48" rx="5" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="4" y="4" width="30" height="40" rx="3" fill="#ffffff"/>
    <rect x="8" y="10" width="14" height="3" rx="1.5" fill="#10b981"/>
    <rect x="8" y="16" width="22" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="8" y="21" width="18" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="8" y="26" width="20" height="2" rx="1" fill="#cbd5e1"/>
    <text x="8" y="38" font-family="monospace" font-size="7" font-weight="bold" fill="#10b981">XLSX</text>
  </g>
</svg>